<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 900" role="img" aria-labelledby="title desc">
<title id="title">The 7 Continuums of Learner Agency</title>
<desc id="desc">Seven dimensions of learner agency, each moving from teacher-centered practice through learner-centered practice toward learner-driven agency: voice, choice, engagement, motivation, ownership, purpose, and self-efficacy.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f8f4e8"/><stop offset=".52" stop-color="#f3f6f4"/><stop offset="1" stop-color="#e6f0ef"/></linearGradient>
  <linearGradient id="stage" x1="0" x2="1"><stop offset="0" stop-color="#f8e7d2"/><stop offset=".5" stop-color="#edf2f1"/><stop offset="1" stop-color="#dcebed"/></linearGradient>
  <style>
    .title{font:700 44px 'Arial Narrow',Arial,sans-serif;letter-spacing:1px;fill:#17232b}
    .credit{font:500 17px Arial,sans-serif;fill:#52616b}
    .dim{font:700 21px Arial,sans-serif;fill:#17232b}
    .stage{font:700 17px Arial,sans-serif;fill:#713d2d}
    .tag{font:600 12px Arial,sans-serif;letter-spacing:.5px;fill:#596d77}
    .body{font:400 14px Arial,sans-serif;fill:#26333a}
    .num{font:700 16px Arial,sans-serif;fill:#fff}
  </style>
</defs>
<rect width="1408" height="900" fill="url(#bg)"/>
<text x="704" y="59" text-anchor="middle" class="title">THE 7 CONTINUUMS OF LEARNER AGENCY</text>
<text x="704" y="86" text-anchor="middle" class="credit">From teacher-centered practice to learner-driven agency</text>
<g id="rows">
<g transform="translate(0 106)"><rect x="40" y="0" width="1328" height="102" rx="14" fill="url(#stage)" stroke="#d8d5ca"/><text x="58" y="36" class="dim">Voice</text><circle cx="246" cy="28" r="14" fill="#8396a5"/><text x="246" y="34" text-anchor="middle" class="num">1</text><text x="270" y="28" class="stage">Expression <tspan class="tag">· TEACHER-CENTERED</tspan></text><text x="270" y="52" class="body">Learners express ideas on teacher-chosen topics.</text><circle cx="688" cy="28" r="14" fill="#87aeb1"/><text x="688" y="34" text-anchor="middle" class="num">2</text><text x="712" y="28" class="stage">Consultation <tspan class="tag">· LEARNER-CENTERED</tspan></text><text x="712" y="52" class="body">Learners share how they learn best and help shape activities.</text><circle cx="1110" cy="28" r="14" fill="#d9a56b"/><text x="1110" y="34" text-anchor="middle" class="num">3</text><text x="1134" y="28" class="stage">Leadership <tspan class="tag">· LEARNER-DRIVEN</tspan></text><text x="1134" y="52" class="body">Learners direct their path and share their voice.</text><path d="M246 78H1300" stroke="#b9c6c4" stroke-width="2"/></g>
<g transform="translate(0 214)"><rect x="40" y="0" width="1328" height="102" rx="14" fill="url(#stage)" stroke="#d8d5ca"/><text x="58" y="36" class="dim">Choice</text><circle cx="246" cy="28" r="14" fill="#8396a5"/><text x="246" y="34" text-anchor="middle" class="num">1</text><text x="270" y="28" class="stage">Options <tspan class="tag">· TEACHER-CENTERED</tspan></text><text x="270" y="52" class="body">Choose from teacher-provided assignment options.</text><circle cx="688" cy="28" r="14" fill="#87aeb1"/><text x="688" y="34" text-anchor="middle" class="num">2</text><text x="712" y="28" class="stage">Customization <tspan class="tag">· LEARNER-CENTERED</tspan></text><text x="712" y="52" class="body">Select tools and resources to show understanding.</text><circle cx="1110" cy="28" r="14" fill="#d9a56b"/><text x="1110" y="34" text-anchor="middle" class="num">3</text><text x="1134" y="28" class="stage">Autonomy <tspan class="tag">· LEARNER-DRIVEN</tspan></text><text x="1134" y="52" class="body">Set goals, choose methods, and propose projects.</text><path d="M246 78H1300" stroke="#b9c6c4" stroke-width="2"/></g>
<g transform="translate(0 322)"><rect x="40" y="0" width="1328" height="102" rx="14" fill="url(#stage)" stroke="#d8d5ca"/><text x="58" y="36" class="dim">Engagement</text><circle cx="246" cy="28" r="14" fill="#8396a5"/><text x="246" y="34" text-anchor="middle" class="num">1</text><text x="270" y="28" class="stage">Compliant <tspan class="tag">· TEACHER-CENTERED</tspan></text><text x="270" y="52" class="body">Complete work to meet expectations and requirements.</text><circle cx="688" cy="28" r="14" fill="#87aeb1"/><text x="688" y="34" text-anchor="middle" class="num">2</text><text x="712" y="28" class="stage">Committed <tspan class="tag">· LEARNER-CENTERED</tspan></text><text x="712" y="52" class="body">Set goals, invest in learning, and reflect on progress.</text><circle cx="1110" cy="28" r="14" fill="#d9a56b"/><text x="1110" y="34" text-anchor="middle" class="num">3</text><text x="1134" y="28" class="stage">Passionate <tspan class="tag">· LEARNER-DRIVEN</tspan></text><text x="1134" y="52" class="body">Follow interests through deep, self-directed inquiry.</text><path d="M246 78H1300" stroke="#b9c6c4" stroke-width="2"/></g>
<g transform="translate(0 430)"><rect x="40" y="0" width="1328" height="102" rx="14" fill="url(#stage)" stroke="#d8d5ca"/><text x="58" y="36" class="dim">Motivation</text><circle cx="246" cy="28" r="14" fill="#8396a5"/><text x="246" y="34" text-anchor="middle" class="num">1</text><text x="270" y="28" class="stage">Extrinsic <tspan class="tag">· TEACHER-CENTERED</tspan></text><text x="270" y="52" class="body">Driven by rewards, grades, compliance, or praise.</text><circle cx="688" cy="28" r="14" fill="#87aeb1"/><text x="688" y="34" text-anchor="middle" class="num">2</text><text x="712" y="28" class="stage">Intrinsic <tspan class="tag">· LEARNER-CENTERED</tspan></text><text x="712" y="52" class="body">Driven by curiosity, interest, pride, and mastery.</text><circle cx="1110" cy="28" r="14" fill="#d9a56b"/><text x="1110" y="34" text-anchor="middle" class="num">3</text><text x="1134" y="28" class="stage">Purpose-driven <tspan class="tag">· LEARNER-DRIVEN</tspan></text><text x="1134" y="52" class="body">Guided by values and a desire to make an impact.</text><path d="M246 78H1300" stroke="#b9c6c4" stroke-width="2"/></g>
<g transform="translate(0 538)"><rect x="40" y="0" width="1328" height="102" rx="14" fill="url(#stage)" stroke="#d8d5ca"/><text x="58" y="36" class="dim">Ownership</text><circle cx="246" cy="28" r="14" fill="#8396a5"/><text x="246" y="34" text-anchor="middle" class="num">1</text><text x="270" y="28" class="stage">External control <tspan class="tag">· TEACHER-CENTERED</tspan></text><text x="270" y="52" class="body">Teacher manages and evaluates progress and output.</text><circle cx="688" cy="28" r="14" fill="#87aeb1"/><text x="688" y="34" text-anchor="middle" class="num">2</text><text x="712" y="28" class="stage">Shared responsibility <tspan class="tag">· LEARNER-CENTERED</tspan></text><text x="712" y="52" class="body">Learners use rubrics, feedback, and self-assessment.</text><circle cx="1110" cy="28" r="14" fill="#d9a56b"/><text x="1110" y="34" text-anchor="middle" class="num">3</text><text x="1134" y="28" class="stage">Full agency <tspan class="tag">· LEARNER-DRIVEN</tspan></text><text x="1134" y="52" class="body">Set milestones and choose evidence of growth.</text><path d="M246 78H1300" stroke="#b9c6c4" stroke-width="2"/></g>
<g transform="translate(0 646)"><rect x="40" y="0" width="1328" height="102" rx="14" fill="url(#stage)" stroke="#d8d5ca"/><text x="58" y="36" class="dim">Purpose</text><circle cx="246" cy="28" r="14" fill="#8396a5"/><text x="246" y="34" text-anchor="middle" class="num">1</text><text x="270" y="28" class="stage">Directed <tspan class="tag">· TEACHER-CENTERED</tspan></text><text x="270" y="52" class="body">Teacher prescribes curriculum objectives and tasks.</text><circle cx="688" cy="28" r="14" fill="#87aeb1"/><text x="688" y="34" text-anchor="middle" class="num">2</text><text x="712" y="28" class="stage">Connected <tspan class="tag">· LEARNER-CENTERED</tspan></text><text x="712" y="52" class="body">Connect learning to interests, goals, and application.</text><circle cx="1110" cy="28" r="14" fill="#d9a56b"/><text x="1110" y="34" text-anchor="middle" class="num">3</text><text x="1134" y="28" class="stage">Transformative <tspan class="tag">· LEARNER-DRIVEN</tspan></text><text x="1134" y="52" class="body">Address real-world issues and contribute to society.</text><path d="M246 78H1300" stroke="#b9c6c4" stroke-width="2"/></g>
<g transform="translate(0 754)"><rect x="40" y="0" width="1328" height="102" rx="14" fill="url(#stage)" stroke="#d8d5ca"/><text x="58" y="36" class="dim">Self-efficacy</text><circle cx="246" cy="28" r="14" fill="#8396a5"/><text x="246" y="34" text-anchor="middle" class="num">1</text><text x="270" y="28" class="stage">Dependent <tspan class="tag">· TEACHER-CENTERED</tspan></text><text x="270" y="52" class="body">Relies on external encouragement and guidance.</text><circle cx="688" cy="28" r="14" fill="#87aeb1"/><text x="688" y="34" text-anchor="middle" class="num">2</text><text x="712" y="28" class="stage">Emerging <tspan class="tag">· LEARNER-CENTERED</tspan></text><text x="712" y="52" class="body">Builds confidence through practice and feedback.</text><circle cx="1110" cy="28" r="14" fill="#d9a56b"/><text x="1110" y="34" text-anchor="middle" class="num">3</text><text x="1134" y="28" class="stage">Empowered <tspan class="tag">· LEARNER-DRIVEN</tspan></text><text x="1134" y="52" class="body">Believes in the ability to learn, adapt, and succeed.</text></g>
</g>
<text x="704" y="887" text-anchor="middle" class="credit">Content by Kathleen McClaskey and Katherine Tosi</text>
</svg>